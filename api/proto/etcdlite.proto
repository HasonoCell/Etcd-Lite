syntax = "proto3";

package etcdlite.v1;

option go_package = "github.com/HasonoCell/Etcd-Lite/api/etcdlitepb;etcdlitepb";

service KV {
  rpc Range(RangeRequest) returns (RangeResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc DeleteRange(DeleteRangeRequest) returns (DeleteRangeResponse);
  rpc Txn(TxnRequest) returns (TxnResponse);
}

service Watch {
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

service Lease {
  rpc LeaseGrant(LeaseGrantRequest) returns (LeaseGrantResponse);
  rpc LeaseKeepAlive(stream LeaseKeepAliveRequest) returns (stream LeaseKeepAliveResponse);
  rpc LeaseRevoke(LeaseRevokeRequest) returns (LeaseRevokeResponse);
}

service Maintenance {
  rpc Status(StatusRequest) returns (StatusResponse);
}

message ResponseHeader {
  uint64 member_id = 1;
  uint64 leader_id = 2;
  uint64 term = 3;
  uint64 raft_index = 4;
  int64 revision = 5;
  string error = 6;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
  int64 create_revision = 3;
  int64 mod_revision = 4;
  int64 version = 5;
  int64 lease_id = 6;
  bool tombstone = 7;
}

message Revision {
  int64 main = 1;
  int64 sub = 2;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PUT = 1;
  EVENT_TYPE_DELETE = 2;
}

message Event {
  EventType type = 1;
  Revision revision = 2;
  KeyValue kv = 3;
  KeyValue prev_kv = 4;
}

message RangeRequest {
  bytes key = 1;
  bytes end = 2;
  int64 limit = 3;
  int64 revision = 4;
  bool serializable = 5;
}

message RangeResponse {
  ResponseHeader header = 1;
  repeated KeyValue kvs = 2;
  int64 count = 3;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  int64 lease_id = 3;
  bool prev_kv = 4;
  uint64 client_id = 5;
  uint64 request_id = 6;
}

message PutResponse {
  ResponseHeader header = 1;
  KeyValue prev_kv = 2;
}

message DeleteRangeRequest {
  bytes key = 1;
  bytes end = 2;
  bool prev_kv = 3;
  uint64 client_id = 4;
  uint64 request_id = 5;
}

message DeleteRangeResponse {
  ResponseHeader header = 1;
  int64 deleted = 2;
  repeated KeyValue prev_kvs = 3;
}

enum CompareTarget {
  COMPARE_TARGET_UNSPECIFIED = 0;
  COMPARE_TARGET_VERSION = 1;
  COMPARE_TARGET_CREATE_REVISION = 2;
  COMPARE_TARGET_MOD_REVISION = 3;
  COMPARE_TARGET_VALUE = 4;
  COMPARE_TARGET_LEASE = 5;
}

enum CompareResult {
  COMPARE_RESULT_UNSPECIFIED = 0;
  COMPARE_RESULT_EQUAL = 1;
  COMPARE_RESULT_NOT_EQUAL = 2;
  COMPARE_RESULT_GREATER = 3;
  COMPARE_RESULT_LESS = 4;
}

message Compare {
  bytes key = 1;
  CompareTarget target = 2;
  CompareResult result = 3;
  int64 version = 4;
  int64 create_revision = 5;
  int64 mod_revision = 6;
  bytes value = 7;
  int64 lease_id = 8;
}

message RequestOp {
  oneof request {
    RangeRequest request_range = 1;
    PutRequest request_put = 2;
    DeleteRangeRequest request_delete_range = 3;
  }
}

message ResponseOp {
  oneof response {
    RangeResponse response_range = 1;
    PutResponse response_put = 2;
    DeleteRangeResponse response_delete_range = 3;
  }
}

message TxnRequest {
  repeated Compare compare = 1;
  repeated RequestOp success = 2;
  repeated RequestOp failure = 3;
  uint64 client_id = 4;
  uint64 request_id = 5;
}

message TxnResponse {
  ResponseHeader header = 1;
  bool succeeded = 2;
  repeated ResponseOp responses = 3;
}

message WatchRequest {
  bytes key = 1;
  bytes end = 2;
  int64 start_revision = 3;
  bool prev_kv = 4;
}

message WatchResponse {
  ResponseHeader header = 1;
  int64 watch_id = 2;
  bool created = 3;
  bool canceled = 4;
  string error = 5;
  int64 compact_revision = 6;
  repeated Event events = 7;
}

message LeaseGrantRequest {
  int64 lease_id = 1;
  int64 ttl = 2;
  uint64 client_id = 3;
  uint64 request_id = 4;
}

message LeaseGrantResponse {
  ResponseHeader header = 1;
  int64 lease_id = 2;
  int64 ttl = 3;
}

message LeaseKeepAliveRequest {
  int64 lease_id = 1;
  uint64 client_id = 2;
  uint64 request_id = 3;
}

message LeaseKeepAliveResponse {
  ResponseHeader header = 1;
  int64 lease_id = 2;
  int64 ttl = 3;
}

message LeaseRevokeRequest {
  int64 lease_id = 1;
  uint64 client_id = 2;
  uint64 request_id = 3;
}

message LeaseRevokeResponse {
  ResponseHeader header = 1;
  int64 deleted = 2;
}

message StatusRequest {}

message StatusResponse {
  ResponseHeader header = 1;
  string state = 2;
  uint64 commit_index = 3;
  uint64 applied_index = 4;
  uint64 last_log_index = 5;
  uint64 snapshot_index = 6;
}
